<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Địa phương – Viet Culture Map</title>
  <meta name="description" content="Hồ sơ văn hóa, lịch sử, địa điểm, đặc sản và nghệ thuật của một tỉnh/thành phố Việt Nam.">
  <link rel="icon" type="image/svg+xml" href="assets/icons/vietnam-silhouette.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tailwind.css">
</head>
<body data-page="detail">
  <!-- Trang chi tiết KHÔNG chạy slideshow chung (không nạp background.js): ảnh riêng của tỉnh (.detail-page-bg) phủ toàn trang, gán bằng detail.js -->
  <div id="global-background" aria-hidden="true">
    <div class="detail-page-bg"></div>
    <div class="background-overlay"></div>
  </div>
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[100] focus:bg-white focus:p-3 focus:rounded">Bỏ qua điều hướng</a>
  <div id="site-header"></div>

  <main id="main" class="pt-16">
    <div id="detail-loading" class="flex justify-center py-32"><div class="spinner" role="status" aria-label="Đang tải hồ sơ"></div></div>

    <div id="detail-error" class="hidden vcm-panel max-w-2xl mx-auto text-center my-24" role="alert">
      <h1 class="font-display text-3xl font-bold text-deep-700">Không tìm thấy địa phương</h1>
      <p id="detail-error-msg" class="text-gray-600 mt-3"></p>
      <a href="explore.html" class="btn-primary mt-6">Về trang Khám phá</a>
    </div>

    <article id="detail-root" class="hidden">
      <!-- Banner -->
      <section id="detail-banner" class="relative overflow-hidden text-white"></section>

      <div class="max-w-7xl mx-auto px-4 sm:px-6 pb-4">
       <div class="vcm-panel">
        <!-- Thanh tab -->
        <div class="sticky top-16 z-30 tab-sticky">
          <div class="tab-list" role="tablist" aria-label="Nội dung địa phương" id="tab-list"></div>
        </div>

        <div class="pt-8 pb-2" id="tab-panels"></div>
       </div>

        <section id="community-section" class="vcm-panel mt-8" aria-labelledby="community-heading">
          <div class="flex flex-wrap items-start justify-between gap-4">
            <div>
              <h2 id="community-heading" class="font-display text-2xl sm:text-3xl font-bold text-deep-700">Chia sẻ trải nghiệm</h2>
              <p class="text-gray-600 mt-2">Bạn đã ghé thăm nơi này? Hãy chia sẻ cảm nhận và giữ cuộc trò chuyện thân thiện.</p>
              <p class="text-xs text-gray-500 mt-2">Bản thử nghiệm: bình luận chỉ được lưu trong trình duyệt hiện tại.</p>
            </div>
          </div>
          <div id="comment-form-host" class="mt-6"></div>
          <div id="comment-list" class="community-list mt-6" aria-live="polite"></div>
        </section>

        <!-- Địa phương liên quan -->
        <section aria-labelledby="related-heading" class="vcm-panel mt-8">
          <h2 id="related-heading" class="font-display text-2xl sm:text-3xl font-bold text-deep-700">Tiếp tục khám phá</h2>
          <p class="text-gray-600 mt-1">Các địa phương khác để bạn tìm hiểu.</p>
          <div id="related-grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-4 mt-6"></div>
        </section>
      </div>
    </article>
  </main>

  <!-- Modal chi tiết mục -->
  <div id="item-modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <button type="button" class="modal-close" id="modal-close" aria-label="Đóng">&times;</button>
      <div id="modal-content" class="modal-body p-6 sm:p-8 pt-10"></div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="js/vendor/jquery-3.7.1.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/community.js"></script>
  <script src="js/main.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
